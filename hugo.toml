[languages]
  [languages.en]
    contentDir = 'content/en'
    languageCode = 'en-us'
    languageName = 'English'
    weight = 1
    title = 'Stratum Gateway'
    [languages.en.params]
      tagline = 'Next-Generation Firewall OS'
      description = 'Stratum Gateway is a FreeBSD-based enterprise firewall OS. It combines the raw power of pf packet filtering with a modern FastAPI management panel, role-based access control, and zero-dependency WireGuard support.'
      companyName = 'Stratum Security'
      contactEmail = 'info@stratumfw.com'
      docsURL = '/resources/documentation/'
      changelogURL = '/resources/changelog/'
      downloadURL = '/download/'
      manifestURL = 'https://update.stratumfw.com/manifest.json'
