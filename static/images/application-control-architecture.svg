<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Stratum Firewall v0.39.0 Application Control, Custom Block Page, Block Page CA and stratum-dpi 1.2 Architecture">
  <defs>
    <linearGradient id="bgApp39" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d1a"/>
      <stop offset="55%" stop-color="#0b1629"/>
      <stop offset="100%" stop-color="#08101f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" rx="18" fill="url(#bgApp39)"/>
  <rect x="12" y="12" width="1176" height="536" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <text x="48" y="54" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">STRATUM FIREWALL v0.39.0 • APPLICATION CONTROL, CUSTOM HTTPS BLOCK PAGE &amp; BLOCK PAGE CA</text>
  <text x="48" y="86" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">Capsicum-Sandboxed DPI, Unbound 198.18.0.1 Block Page &amp; _stratumbp Isolation</text>
  <line x1="48" y1="106" x2="1152" y2="106" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Box 1 -->
  <rect x="48" y="132" width="332" height="334" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.48" stroke-width="1.5"/>
  <rect x="68" y="152" width="222" height="24" rx="12" fill="#0c2a42"/>
  <text x="179" y="168" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">1 • OUT-OF-PATH DPI &amp; CAPSICUM</text>
  <text x="68" y="202" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">stratum-dpi 1.2 Engine</text>
  <text x="68" y="228" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Passive packet copy per LAN/VLAN; never</text>
  <text x="78" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">inline — forwarding unaffected if stopped</text>
  <text x="68" y="276" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Unprivileged process locked in FreeBSD</text>
  <text x="78" y="296" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">Capsicum capability sandbox</text>
  <text x="68" y="324" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Daily device/app totals only on disk</text>
  <rect x="68" y="352" width="292" height="92" rx="10" fill="#08101f" stroke="#1e293b"/>
  <text x="84" y="376" fill="#7dd3fc" font-family="monospace" font-size="12.5" font-weight="700">Instant SNI &amp; Payload Trust</text>
  <text x="84" y="398" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">nDPI (LGPLv3) + Stratum TLS ClientHello</text>
  <text x="84" y="416" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">&amp; QUIC Initial parser; port/IP guesses</text>
  <text x="84" y="434" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">never trigger false blocks</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="380" y1="298" x2="426" y2="298" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="426,292 438,298 426,304" fill="#f59e0b"/>
  <text x="409" y="284" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11">policy</text>

  <!-- Box 2 -->
  <rect x="438" y="132" width="336" height="334" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.62" stroke-width="1.5"/>
  <rect x="458" y="152" width="236" height="24" rx="12" fill="#2b1d07"/>
  <text x="576" y="168" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">2 • CUSTOM HTTPS BLOCK PAGE</text>
  <text x="458" y="202" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Unbound + Block Page CA</text>
  <text x="458" y="228" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Unbound answers ~1,000 nDPI &amp; custom</text>
  <text x="468" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">app domains with 198.18.0.1 (DoH off)</text>
  <text x="458" y="276" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Isolated _stratumbp server signs on-the-spot</text>
  <text x="468" y="296" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">cert with Block Page CA (.cer GPO / .crt)</text>
  <text x="458" y="324" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Own logo, top banner, texts &amp; live preview</text>
  <rect x="458" y="352" width="296" height="92" rx="10" fill="#08101f" stroke="#1e293b"/>
  <text x="474" y="376" fill="#fbbf24" font-family="monospace" font-size="12.5" font-weight="700">Shown Details (Live Without Apply)</text>
  <text x="474" y="398" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Displays Site, Application, Rule, Device &amp;</text>
  <text x="474" y="416" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12">Time in any language; unreachable directly</text>
  <text x="474" y="434" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">from LAN/WAN (_stratumbp sandboxed)</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="774" y1="298" x2="820" y2="298" stroke="#34d399" stroke-width="2.5"/>
  <polygon points="820,292 832,298 820,304" fill="#34d399"/>
  <text x="803" y="284" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">pfctl</text>

  <!-- Box 3 -->
  <rect x="832" y="132" width="320" height="334" rx="14" fill="#0f172a" stroke="#10b981" stroke-opacity="0.48" stroke-width="1.5"/>
  <rect x="852" y="152" width="218" height="24" rx="12" fill="#082c24"/>
  <text x="961" y="168" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">3 • SURGICAL PF FALLBACK &amp; AI</text>
  <text x="852" y="202" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">External-DNS &amp; CDN Safe</text>
  <text x="852" y="228" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Clients bypassing Unbound DNS are still</text>
  <text x="862" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">blocked by cutting TLS/QUIC handshakes</text>
  <text x="852" y="276" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Shared Cloudflare/Google CDN IPs stay safe</text>
  <text x="852" y="304" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Unnamed VPN tunnels blocked 10m in pf</text>
  <rect x="852" y="352" width="280" height="92" rx="10" fill="#08101f" stroke="#1e293b"/>
  <text x="868" y="376" fill="#34d399" font-family="monospace" font-size="12.5" font-weight="700">Monitor Only + 16-Tool MCP AI</text>
  <text x="868" y="398" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Audit rules in Monitor only first; track Page</text>
  <text x="868" y="416" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">shown, Blocked &amp; Would block in UI and via</text>
  <text x="868" y="434" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">the 16th MCP tool (Application usage).</text>

  <rect x="48" y="488" width="1104" height="40" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="600" y="513" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Zero full-traffic MITM decryption: <tspan fill="#fbbf24" font-weight="700">Block Page CA</tspan> signs certificates <tspan fill="#34d399" font-weight="700">only for blocked domains</tspan> redirected to <tspan fill="#7dd3fc" font-weight="700">198.18.0.1</tspan>.</text>
</svg>
