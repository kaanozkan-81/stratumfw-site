<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Stratum Firewall v0.38.0 Capsicum-Sandboxed Application Control and stratum-dpi 1.2 Architecture">
  <defs>
    <linearGradient id="bgApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d1a"/>
      <stop offset="55%" stop-color="#0b1629"/>
      <stop offset="100%" stop-color="#08101f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" rx="18" fill="url(#bgApp)"/>
  <rect x="12" y="12" width="1176" height="536" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <text x="48" y="54" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">STRATUM FIREWALL v0.38.0 • FIREWALL &gt; APPLICATION CONTROL &amp; STRATUM-DPI 1.2</text>
  <text x="48" y="86" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">Capsicum-Sandboxed DPI, Monitor-First Rules &amp; Surgical TLS/QUIC Blocking</text>
  <line x1="48" y1="106" x2="1152" y2="106" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Box 1 -->
  <rect x="48" y="132" width="332" height="334" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.48" stroke-width="1.5"/>
  <rect x="68" y="152" width="222" height="24" rx="12" fill="#0c2a42"/>
  <text x="179" y="168" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">1 • OUT-OF-PATH DPI &amp; CAPSICUM</text>
  <text x="68" y="202" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">stratum-dpi 1.2 Engine</text>
  <text x="68" y="228" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Reads a passive traffic copy per LAN/VLAN;</text>
  <text x="78" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">never inline — traffic flows even if stopped</text>
  <text x="68" y="276" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Unprivileged user locked in FreeBSD</text>
  <text x="78" y="296" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">Capsicum capability sandbox</text>
  <text x="68" y="324" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Daily device/app totals only on disk</text>
  <rect x="68" y="352" width="292" height="92" rx="10" fill="#08101f" stroke="#1e293b"/>
  <text x="84" y="376" fill="#7dd3fc" font-family="monospace" font-size="12.5" font-weight="700">Instant Confidence Tagging</text>
  <text x="84" y="398" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">nDPI (LGPLv3) + Stratum TLS ClientHello</text>
  <text x="84" y="416" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">&amp; QUIC Initial parser; SNI named at once</text>
  <text x="84" y="434" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">without waiting for packet limits</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="380" y1="298" x2="426" y2="298" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="426,292 438,298 426,304" fill="#f59e0b"/>
  <text x="409" y="284" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11">stream</text>

  <!-- Box 2 -->
  <rect x="438" y="132" width="336" height="334" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.62" stroke-width="1.5"/>
  <rect x="458" y="152" width="224" height="24" rx="12" fill="#2b1d07"/>
  <text x="570" y="168" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">2 • CONFIDENCE-GATED POLICY</text>
  <text x="458" y="202" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Monitor Only vs. Block Rules</text>
  <text x="458" y="228" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Match interfaces, Stratum categories, apps,</text>
  <text x="468" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">custom domains &amp; unnamed TLS/QUIC</text>
  <text x="458" y="276" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Monitor only (default) logs Would-block</text>
  <text x="468" y="296" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">hits safely before enforcing Block</text>
  <text x="458" y="324" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Per-device/subnet exceptions (e.g. IT)</text>
  <rect x="458" y="352" width="296" height="92" rx="10" fill="#08101f" stroke="#1e293b"/>
  <text x="474" y="376" fill="#fbbf24" font-family="monospace" font-size="12.5" font-weight="700">Zero False-Positive Guardrails</text>
  <text x="474" y="398" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Acts ONLY on verified SNI or packet payload;</text>
  <text x="474" y="416" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12">port/IP guesses, DNS/DHCP/NTP &amp; RFC1918</text>
  <text x="474" y="434" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">destinations are never blocked</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="774" y1="298" x2="820" y2="298" stroke="#34d399" stroke-width="2.5"/>
  <polygon points="820,292 832,298 820,304" fill="#34d399"/>
  <text x="803" y="284" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">pfctl</text>

  <!-- Box 3 -->
  <rect x="832" y="132" width="320" height="334" rx="14" fill="#0f172a" stroke="#10b981" stroke-opacity="0.48" stroke-width="1.5"/>
  <rect x="852" y="152" width="210" height="24" rx="12" fill="#082c24"/>
  <text x="957" y="168" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">3 • SURGICAL PF &amp; AI VISIBILITY</text>
  <text x="852" y="202" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Shared-CDN Safe Blocking</text>
  <text x="852" y="228" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Cuts named HTTPS flows during handshake</text>
  <text x="862" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">without breaking other sites on shared CDN</text>
  <text x="852" y="276" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• QUIC refused 10m -&gt; clean TCP SNI check</text>
  <text x="852" y="304" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">• Unnamed VPN tunnels blocked 10m in pf</text>
  <rect x="852" y="352" width="280" height="92" rx="10" fill="#08101f" stroke="#1e293b"/>
  <text x="868" y="376" fill="#34d399" font-family="monospace" font-size="12.5" font-weight="700">Dashboard &amp; 16-Tool MCP AI</text>
  <text x="868" y="398" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Live Applications dashboard card + read-only</text>
  <text x="868" y="416" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Application usage MCP tool for natural-language</text>
  <text x="868" y="434" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">audits; blocks reload across pf Apply.</text>

  <rect x="48" y="488" width="1104" height="40" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="600" y="513" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Stopping the collector or switching a rule to <tspan fill="#fbbf24" font-weight="700">Monitor only</tspan> lifts every active <tspan fill="#34d399" font-weight="700">pf</tspan> block immediately.</text>
</svg>
