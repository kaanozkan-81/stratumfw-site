<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8f9fa; }
      .line { stroke: #0F1E3D; stroke-width: 3; fill: none; }
      .node-bg { fill: #ffffff; stroke: #0F1E3D; stroke-width: 2; }
      .fw-bg { fill: #0F1E3D; }
      .text-title { fill: #0F1E3D; font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .text-label { fill: #ffffff; font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .text-sub { fill: #6c757d; font-family: sans-serif; font-size: 12px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="800" height="400" class="bg" rx="10"/>
  <g transform="translate(100, 200)">
    <path d="M 40 20 C 40 -10, 80 -10, 80 20 C 110 20, 110 60, 80 60 L 20 60 C -10 60, -10 20, 20 20 Z" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
    <text x="35" y="45" class="text-sub" fill="#495057">İnternet</text>
  </g>
  <line x1="200" y1="240" x2="320" y2="240" class="line" stroke-dasharray="5,5"/>
  <line x1="480" y1="240" x2="600" y2="240" class="line" />
  <line x1="600" y1="240" x2="600" y2="120" class="line" />
  <line x1="600" y1="240" x2="600" y2="360" class="line" />
  <g transform="translate(320, 190)">
    <rect width="160" height="100" rx="10" class="fw-bg"/>
    <path d="M 30 40 L 50 30 L 70 40 L 70 60 C 70 75, 50 85, 50 85 C 50 85, 30 75, 30 60 Z" fill="none" stroke="#4ade80" stroke-width="3"/>
    <text x="80" y="50" class="text-label">STRATUM</text>
    <text x="80" y="70" class="text-label" fill="#4ade80">FIREWALL</text>
  </g>
  <g transform="translate(550, 200)">
    <rect width="100" height="80" rx="5" class="node-bg"/>
    <text x="50" y="35" class="text-title">Switch</text>
    <text x="50" y="55" class="text-sub">LAN</text>
  </g>
  <g transform="translate(680, 80)">
    <rect width="80" height="60" rx="5" class="node-bg"/>
    <text x="40" y="35" class="text-sub">Sunucu</text>
  </g>
  <g transform="translate(680, 200)">
    <rect width="80" height="60" rx="5" class="node-bg"/>
    <text x="40" y="35" class="text-sub">PC</text>
  </g>
  <g transform="translate(680, 320)">
    <rect width="80" height="60" rx="5" class="node-bg"/>
    <text x="40" y="35" class="text-sub">Mobil</text>
  </g>
</svg>
