  <!-- Orta Katman (Koyu ve kalın çizgi) -->
  <path d="M20 90 L100 130 L180 90" fill="none" stroke="#B45309" stroke-width="10" stroke-linejoin="round"/>
  <!-- Alt Katman (Koyu ve kalın çizgi) -->
  <path d="M20 120 L100 160 L180 120" fill="none" stroke="#B45309" stroke-width="10" stroke-linejoin="round" opacity="0.85"/>
</svg>
