<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E8EED"/>
      <stop offset="100%" stop-color="#0EA5A0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main Shield Shape -->
  <path d="M50 8 L88 26 V62 C88 82 50 95 50 95 C50 95 12 82 12 62 V26 Z" fill="#0F1E3D" stroke="url(#cyberGradient)" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Circuit Nodes (API/Network) -->
  <circle cx="50" cy="8" r="3.5" fill="#3E8EED"/>
  <circle cx="88" cy="26" r="3.5" fill="#3E8EED"/>
  <circle cx="12" cy="26" r="3.5" fill="#3E8EED"/>
  
  <!-- Layers (Stratum) -->
  <!-- Top Layer (Management Plane) -->
  <rect x="28" y="32" width="44" height="7" rx="3.5" fill="url(#cyberGradient)" />
  <!-- Middle Layer (Config Engine) -->
  <rect x="33" y="46" width="34" height="7" rx="3.5" fill="#0EA5A0" />
  <!-- Bottom Layer (Kernel/pf) -->
  <rect x="38" y="60" width="24" height="7" rx="3.5" fill="#16325C" filter="url(#glow)"/>
  
  <!-- Data Flow Connections -->
  <line x1="50" y1="39" x2="50" y2="46" stroke="#3E8EED" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="50" y1="53" x2="50" y2="60" stroke="#0EA5A0" stroke-width="2" stroke-dasharray="2 2"/>
</svg>
